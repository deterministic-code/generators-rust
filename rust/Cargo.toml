[package]
name = "deterministic"
version = "0.0.6"
edition = "2021"
description = "Rust port of the deterministic repositories layer."
license = "MIT"
repository = "https://github.com/rmcfadden/deterministic"

[workspace]

[lib]
name = "deterministic"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
dotenvy = "0.15"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["sync", "rt", "rt-multi-thread", "macros", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "mysql", "any", "json", "chrono", "uuid"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["catch-panic", "cors", "fs", "limit"] }
serde_qs = "0.13"
jsonwebtoken = "9"
serde_urlencoded = "0.7"
urlencoding = "2"
http-body-util = "0.1"

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "mysql"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonschema = { version = "0.17", default-features = false }
tempfile = "3"
