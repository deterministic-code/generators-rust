name: Rust crate CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  crate:
    name: fmt + cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        run: cargo fmt --check

      - name: Cargo tests (full suite incl. testcontainers)
        run: cargo test --locked
